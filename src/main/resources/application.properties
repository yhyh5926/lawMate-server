spring.application.name=lawMate-server

# Oracle DB Connection (가장 표준적인 형식 하나로 통일)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@192.168.0.32:1521/xe
spring.datasource.username=lawMate
spring.datasource.password=1234

# HikariCP (연결 대기 시간을 충분히 확보)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000

# MyBatis Settings
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.edu.springboot.domain.**.vo
mybatis.configuration.map-underscore-to-camel-case=true