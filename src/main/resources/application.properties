spring.application.name=lawMate-server

# Oracle DB Connection 
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@192.168.0.32:1521:xe
spring.datasource.username=lawMate
spring.datasource.password=1234

# HikariCP 
spring.datasource.hikari.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.jdbc-url=jdbc:oracle:thin:@192.168.0.32:1521:xe
spring.datasource.hikari.username=lawMate
spring.datasource.hikari.password=1234
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000

# MyBatis Settings
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.edu.springboot.domain.**.vo
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

file.upload-dir=uploads/chat
